<!DOCTYPE html>
<html>

<head>

<title>History</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav>

    <h2>🩺 Diabetes Predictor</h2>

    <div>

        <a href="/">Home</a>
        <a href="/assessment">Assessment</a>
        <a href="/history">History</a>

    </div>

</nav>

<h1 class="title">

Prediction History

</h1>

<table>

<tr>

    <th>Name</th>
    <th>Age</th>
    <th>Glucose</th>
    <th>BP</th>
    <th>BMI</th>
    <th>Risk</th>
    <th>Confidence</th>

</tr>

{% for row in data %}

<tr>

    <td>{{ row[1] }}</td>

    <td>{{ row[2] }}</td>

    <td>{{ row[3] }}</td>

    <td>{{ row[4] }}</td>

    <td>{{ row[5] }}</td>

    <td>{{ row[6] }}</td>

    <td>{{ row[7] }}%</td>

</tr>

{% endfor %}

</table>

</body>
</html>
